# =============================================================================
# Nginx Production Configuration - Expense Management System
# =============================================================================
# Mounted into the frontend container at /etc/nginx/conf.d/default.conf
# This replaces the existing expense-frontend/nginx.conf for OCI deployment.
#
# Routes:
#   /            → Static React SPA (try_files → index.html)
#   /api/*       → Proxy to Spring Boot backend (localhost:8080)
#   /actuator/*  → Proxy to Spring Boot actuator endpoints (health, metrics)
#
# SSL termination: Handled by the OCI Load Balancer or certbot on this server.
# This config listens on port 80. For HTTPS, certbot modifies this file.
# =============================================================================

upstream backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Client upload size (for any file/image upload features)
    client_max_body_size 10M;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # API Endpoints → Spring Boot Backend
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Forward real client IP (from the LB)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Connection pooling
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }

    # -----------------------------------------------------------------------
    # Actuator Endpoints (Health, Metrics, Info) → Spring Boot
    # -----------------------------------------------------------------------
    location /actuator/ {
        # Restrict to internal/LB access only in production
        # For OCI, the LB health checker accesses this, so keep it open
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    # -----------------------------------------------------------------------
    # Static Files (React SPA)
    # -----------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing: serve index.html for any non-file paths
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (they have content hashes)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # -----------------------------------------------------------------------
    # Deny hidden files
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}